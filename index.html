<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GrocerQuick POS - Sistema de Punto de Venta</title>
    
    <!-- Fuentes de Google Fonts (Work Sans y JetBrains Mono) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500&family=Work+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    
    <!-- Hoja de estilos CSS -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Encabezado y Navegación Principal -->
    <header class="navbar">
        <div class="logo">GrocerQuick POS</div>
        <nav class="nav-links">
            <a href="#conocenos">Conócenos</a>
            <a href="#contacto">Contacto</a>
            <a href="#login" class="btn-login" id="btnLogin">Login</a>
        </nav>
    </header>

    <main>
        <!-- Sección Hero / Presentación Principal -->
        <section class="hero">
            <div class="hero-content">
                <h1>Gestión Eficiente para tu Supermercado</h1>
                <p>Simplifica tus operaciones diarias con GrocerQuick POS. Un sistema diseñado para la velocidad, claridad y eficiencia ergonómica en el punto de venta.</p>
                <a href="#comenzar" class="btn-cta" id="btnComenzar">Comenzar Ahora &rarr;</a>
            </div>
            
            <div class="hero-image">
                <!-- Imagen principal local descargada en img/ -->
                <img src="img/hero-pos.jpg" alt="Punto de venta GrocerQuick POS" id="heroImg">
            </div>
        </section>
